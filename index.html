const TERMS=[{"id":0,"group":"Inquiry","term":"Science inquiry","definition":"The systematic process of investigating psychological questions by collecting, analysing and evaluating evidence.","points":["Research question","appropriate method","evidence-based conclusions"],"source":"SYL","tip":"Do not equate inquiry with experiments alone."},{"id":1,"group":"Inquiry","term":"Aim","definition":"The broad purpose of a psychological investigation: what the researcher intends to examine.","points":["Purpose","research focus"],"source":"2023:6","tip":"Aim is not the same thing as a specific prediction."},{"id":2,"group":"Inquiry","term":"Hypothesis","definition":"A precise, testable prediction about the relationship or difference between variables.","points":["Predicts outcome","testable","variables"],"source":"2025:11","tip":"A directional hypothesis predicts which group has the higher/lower DV."},{"id":3,"group":"Inquiry","term":"Operational hypothesis","definition":"A testable prediction specifying the population, manipulation/levels of the IV, operationally measured DV and predicted direction of results.","points":["Population","IV","DV","direction","DV measurement"],"source":"2022:2","tip":"Use all five marking points when given five marks."},{"id":4,"group":"Inquiry","term":"Inquiry question","definition":"An open-ended, exploratory question guiding qualitative research without predicting a particular outcome.","points":["Open-ended","exploratory","research focus"],"source":"2025:11","tip":"Avoid making it a yes/no hypothesis."},{"id":5,"group":"Inquiry","term":"Independent variable (IV)","definition":"The variable manipulated or varied by a researcher to investigate its potential effect on an outcome.","points":["Manipulated factor","differing conditions"],"source":"2024:12","tip":"Always distinguish what is varied from what is measured."},{"id":6,"group":"Inquiry","term":"Dependent variable (DV)","definition":"The measured outcome expected to change as a result of variation in the independent variable.","points":["Measured outcome","operational definition"],"source":"2024:12","tip":"State the unit/measurement method whenever possible."},{"id":7,"group":"Inquiry","term":"Controlled variable","definition":"A factor held constant across conditions to prevent it from influencing the dependent variable.","points":["Held constant","improves fairness of comparison"],"source":"2024:12","tip":"E.g., same testing room and time allowed."},{"id":8,"group":"Inquiry","term":"Extraneous variable","definition":"A variable other than the IV that may influence the DV and introduce unwanted variation.","points":["Other than IV","potential DV influence"],"source":"SYL","tip":"Participant, environmental and researcher sources are examinable."},{"id":9,"group":"Inquiry","term":"Confounding variable","definition":"An uncontrolled extraneous factor that systematically varies with the IV, making its effect on the DV difficult to separate.","points":["Systematic relationship with IV","alternative explanation"],"source":"SYL","tip":"An extraneous variable is not necessarily confounding."},{"id":10,"group":"Inquiry","term":"Participant variables","definition":"Characteristics of participants that can influence results, such as memory ability, sleep or motivation.","points":["Individual differences","possible DV impact"],"source":"SYL","tip":"Random allocation can distribute these across groups."},{"id":11,"group":"Inquiry","term":"Environmental variables","definition":"Uncontrolled features of the research environment, such as lighting or noise, that affect performance.","points":["Testing-setting effects"],"source":"SYL","tip":"Standardise the room, equipment and time."},{"id":12,"group":"Inquiry","term":"Researcher variables","definition":"Researcher behaviours or expectations that may inadvertently influence participants or measurements.","points":["Researcher influence on results"],"source":"2021:3","tip":"A standardised script or double-blind process can reduce effects."},{"id":13,"group":"Inquiry","term":"Experimental research","definition":"Research in which an IV is deliberately manipulated and an outcome is measured, often with experimental and control conditions.","points":["Manipulation","IV","DV"],"source":"2022:2","tip":"Experiments can investigate cause-and-effect when well controlled."},{"id":14,"group":"Inquiry","term":"Control group","definition":"A comparison group not exposed to the experimental manipulation or active IV condition.","points":["No experimental treatment","comparison"],"source":"2023:2","tip":"Control groups can receive a placebo."},{"id":15,"group":"Inquiry","term":"Experimental group","definition":"The group exposed to the experimental condition or manipulation of the independent variable.","points":["Receives active condition"],"source":"2023:2","tip":"Identify this from scenario evidence."},{"id":16,"group":"Inquiry","term":"Non-experimental research","definition":"Research that observes or measures variables without deliberately manipulating an IV.","points":["No manipulation of variables"],"source":"2023:4","tip":"Does not demonstrate causation simply from correlation."},{"id":17,"group":"Inquiry","term":"Observational study","definition":"Research involving systematic recording of behaviour in a natural or controlled setting without necessarily manipulating variables.","points":["Observes behaviour","records systematically"],"source":"SYL","tip":"Differentiate naturalistic observation from controlled lab experiments."},{"id":18,"group":"Inquiry","term":"Case study","definition":"An in-depth investigation of a particular individual, group or event using multiple sources of evidence.","points":["Depth","detailed case","limited generalisability"],"source":"SYL","tip":"H.M. is a good memory case-study example."},{"id":19,"group":"Inquiry","term":"Correlational research","definition":"Investigates the relationship between two measured variables without manipulating them.","points":["Strength","direction","not causal"],"source":"2022:5","tip":"A third variable may explain an association."},{"id":20,"group":"Inquiry","term":"Longitudinal design","definition":"Research following the same individuals repeatedly across time to examine change or development.","points":["Same participants","repeated measurements"],"source":"2021:3","tip":"Strength: tracks individual change. Weakness: attrition and time."},{"id":21,"group":"Inquiry","term":"Cross-sectional design","definition":"Research comparing different age or other groups at a single point in time to examine group differences.","points":["Different groups","one point in time"],"source":"2021:2","tip":"Cohort effects can weaken interpretation."},{"id":22,"group":"Inquiry","term":"Population","definition":"The entire group of people to whom the research question or findings relate.","points":["Defined target group"],"source":"2021:2","tip":"Do not label the participant subset as the population."},{"id":23,"group":"Inquiry","term":"Sample","definition":"The subset of a target population selected to participate in an investigation.","points":["Subset","participants"],"source":"2021:2","tip":"Explain how representative it is."},{"id":24,"group":"Inquiry","term":"Convenience sampling","definition":"Recruiting people who are readily available or accessible to the researcher.","points":["Easy availability","selection bias risk"],"source":"2024:13","tip":"Fast and inexpensive, but often unrepresentative."},{"id":25,"group":"Inquiry","term":"Snowball sampling","definition":"Existing participants refer or recruit further participants from their social networks.","points":["Participant referral","network bias"],"source":"2025:2","tip":"Useful for hard-to-reach groups; high selection bias risk."},{"id":26,"group":"Inquiry","term":"Random sampling","definition":"Selecting people so that each member of the target population has an equal chance of selection.","points":["Equal chance of being sampled"],"source":"2024:11","tip":"Random sampling is NOT random allocation."},{"id":27,"group":"Inquiry","term":"Stratified sampling","definition":"Dividing the population into relevant subgroups and sampling from each to reflect their representation.","points":["Subgroups","representation"],"source":"2025:3","tip":"Can improve sample representativeness."},{"id":28,"group":"Inquiry","term":"Random allocation","definition":"Assigning recruited participants to conditions by chance to reduce systematic group differences.","points":["Assignment to groups","chance"],"source":"SYL","tip":"Sampling selects participants; allocation places them in groups."},{"id":29,"group":"Inquiry","term":"Placebo effect","definition":"Change in behaviour or response caused by expectations about receiving treatment rather than the treatment itself.","points":["Expectations","perceived treatment"],"source":"SYL","tip":"Control via placebo treatment where appropriate."},{"id":30,"group":"Inquiry","term":"Experimenter effect","definition":"The researcher's behaviour or expectations influencing participants' performance or the interpretation of data.","points":["Influence by researcher","response or data"],"source":"2021:3","tip":"Use consistent instructions and blinding."},{"id":31,"group":"Inquiry","term":"Demand characteristics","definition":"Cues allowing participants to infer a study's purpose, potentially altering behaviour to match expectations.","points":["Cues to purpose","changed behaviour"],"source":"SYL","tip":"Single-blind methods may help reduce them."},{"id":32,"group":"Inquiry","term":"Single-blind procedure","definition":"A research procedure in which participants are unaware of the treatment/condition allocation relevant to expectations.","points":["Participants unaware"],"source":"SYL","tip":"Especially relevant to placebo and demand effects."},{"id":33,"group":"Inquiry","term":"Double-blind procedure","definition":"A procedure in which participants and the interacting researcher or assessor do not know treatment allocation.","points":["Both parties unaware of allocation"],"source":"2021:3","tip":"Helps reduce placebo and experimenter effects."},{"id":34,"group":"Inquiry","term":"Standardisation","definition":"Keeping procedures, instructions and conditions consistent across participants.","points":["Consistent method","reliability and control"],"source":"2025:6","tip":"Give a concrete way the proposed study can standardise."},{"id":35,"group":"Inquiry","term":"Quantitative data","definition":"Numerical information that can be counted, measured or analysed statistically.","points":["Numbers","measurable"],"source":"2024:13","tip":"Likert rating data are quantitative but may remain subjective."},{"id":36,"group":"Inquiry","term":"Qualitative data","definition":"Non-numerical descriptive information about experiences, meaning, behaviour or perspectives.","points":["Words","depth","descriptions"],"source":"2025:14","tip":"Interview transcripts commonly generate qualitative data."},{"id":37,"group":"Inquiry","term":"Subjective measure","definition":"Data based on an individual's own report, opinion or judgement rather than a direct physical measurement.","points":["Self-report","potential reporting bias"],"source":"2023:5","tip":"Likert scales can yield quantitative subjective data."},{"id":38,"group":"Inquiry","term":"Objective measure","definition":"Measurement made using observable or physiological indicators less influenced by personal judgement.","points":["External indicator","less subjective"],"source":"2022:5","tip":"Heart rate, breathing rate and GSR are syllabus examples."},{"id":39,"group":"Inquiry","term":"Mixed-methods approach","definition":"A research approach combining qualitative and quantitative data to broaden the evidence collected.","points":["Both data types","complementary strengths"],"source":"SYL","tip":"Do not confuse objective with quantitative."},{"id":40,"group":"Inquiry","term":"Structured interview","definition":"An interview with predetermined questions asked consistently in the same way.","points":["Fixed questions","consistency"],"source":"SYL","tip":"Improves comparability but limits flexibility."},{"id":41,"group":"Inquiry","term":"Semi-structured interview","definition":"An interview with planned questions plus flexibility to probe and follow up responses.","points":["Guide","follow-up prompts"],"source":"2025:14","tip":"Can clarify the participant's underlying motivations."},{"id":42,"group":"Inquiry","term":"Focus group","definition":"A guided discussion with several participants about a research topic.","points":["Multiple people","group discussion"],"source":"2025:14","tip":"Can generate detailed interaction but peer pressure may influence answers."},{"id":43,"group":"Inquiry","term":"Likert scale","definition":"A rating scale recording levels of agreement, frequency or intensity in ordered response categories.","points":["Ordered options","numerical response"],"source":"SYL","tip":"Usually quantitative, though subjective."},{"id":44,"group":"Inquiry","term":"Mean","definition":"The arithmetic average obtained by dividing the sum of scores by the number of scores.","points":["Sum divided by n"],"source":"2025:2","tip":"Outliers can greatly affect this."},{"id":45,"group":"Inquiry","term":"Median","definition":"The central score in ordered data, or mean of the two central scores when there is an even number.","points":["Middle ordered value"],"source":"2023:4","tip":"Often preferred to mean for skewed data."},{"id":46,"group":"Inquiry","term":"Pearson's correlation coefficient (r)","definition":"A statistic between −1 and +1 indicating the strength and direction of a linear association.","points":["Sign = direction","magnitude = strength"],"source":"2024:9","tip":"Correlation does not establish cause and effect."},{"id":47,"group":"Inquiry","term":"Internal validity","definition":"The extent to which changes in the DV can credibly be attributed to the IV rather than alternative factors.","points":["Control of confounds","cause-effect inference"],"source":"2025:16","tip":"Be specific about which unwanted variable threatens validity."},{"id":48,"group":"Inquiry","term":"External validity","definition":"The extent to which study findings can be applied beyond the investigated setting or sample.","points":["Application to other contexts"],"source":"2025:16","tip":"Think ecological validity and representativeness."},{"id":49,"group":"Inquiry","term":"Validity (general)","definition":"The extent to which a measure or investigation assesses what it claims or intends to assess.","points":["Measures intended construct"],"source":"2025:16","tip":"Do not equate validity with consistency."},{"id":50,"group":"Inquiry","term":"Reliability (general)","definition":"The consistency or stability of a measurement or investigation's results under comparable conditions.","points":["Consistent results","similar conditions"],"source":"2025:5","tip":"A valid result is not automatically reliable, or vice versa."},{"id":51,"group":"Inquiry","term":"Test–retest reliability","definition":"Consistency of results when the same measure is administered again under comparable conditions.","points":["Same test","repeated occasions"],"source":"SYL","tip":"Allow for practice or memory effects when interpreting."},{"id":52,"group":"Inquiry","term":"Inter-rater reliability","definition":"The degree of agreement between independent observers or scorers recording the same behaviour.","points":["Agreement between raters"],"source":"SYL","tip":"Use clear operational definitions and rater training."},{"id":53,"group":"Inquiry","term":"Generalisability","definition":"The extent to which findings from a sample can reasonably be applied to the wider target population.","points":["Sample → population","representativeness"],"source":"2024:7","tip":"Mention sampling method, size and relevant diversity."},{"id":54,"group":"Inquiry","term":"Informed consent","definition":"Providing sufficient information about research purposes, risks, procedures and rights so a person can choose freely to participate.","points":["Purpose","risks","rights","voluntary agreement"],"source":"2023:3","tip":"Explain exactly what information is given, not just 'they consent'."},{"id":55,"group":"Inquiry","term":"Withdrawal rights","definition":"The right of participants to leave a study without coercion, disadvantage or penalty.","points":["Can discontinue","no penalty"],"source":"2023:3","tip":"Include consequences or no consequences in applied responses."},{"id":56,"group":"Inquiry","term":"Deception (ethics)","definition":"Deliberately withholding or misleading participants about aspects of the research when ethically justified and later explained.","points":["Misleading information","ethical justification"],"source":"SYL","tip":"Evaluate whether alternatives existed and debrief afterwards."},{"id":57,"group":"Inquiry","term":"Confidentiality","definition":"Protecting identifiable participant information from unauthorised disclosure.","points":["Protection of identities and data"],"source":"2025:18","tip":"Anonymisation, secure storage and restricted access are examples."},{"id":58,"group":"Inquiry","term":"Privacy","definition":"Respecting participants' control over access to their personal information and circumstances.","points":["Respect for personal boundaries"],"source":"2025:18","tip":"Privacy and confidentiality are related but not identical."},{"id":59,"group":"Inquiry","term":"Debriefing","definition":"Informing participants afterwards about the study's purpose, procedures and deception, and addressing concerns.","points":["Post-study explanation","welfare"],"source":"2025:18","tip":"Vital for studies involving deception."},{"id":60,"group":"Inquiry","term":"Ethics committee","definition":"A group that reviews, approves and monitors research proposals to protect participant welfare and research integrity.","points":["Approval","monitoring","welfare"],"source":"2025:7","tip":"Two roles may mean 4 marks: name and explain each."},{"id":61,"group":"Inquiry","term":"Replacement (animal ethics)","definition":"Use alternatives to animals whenever a scientifically suitable option exists.","points":["Alternatives to animals"],"source":"SYL","tip":"Part of the 3Rs framework."},{"id":62,"group":"Inquiry","term":"Reduction (animal ethics)","definition":"Use the minimum number of animals required to obtain scientifically reliable findings.","points":["Minimise numbers"],"source":"SYL","tip":"Do not sacrifice the scientific adequacy of the sample."},{"id":63,"group":"Inquiry","term":"Refinement (animal ethics)","definition":"Improve procedures and care to minimise pain, stress and harm to animals.","points":["Minimise suffering"],"source":"SYL","tip":"E.g., less invasive methods or improved living conditions."},{"id":64,"group":"Memory","term":"Sensation","definition":"The physical detection of raw sensory information from the environment by sensory receptors.","points":["Physical detection","raw sensory stimuli"],"source":"2024:2","tip":"Contrast with psychological interpretation (perception)."},{"id":65,"group":"Memory","term":"Perception","definition":"The psychological organisation and interpretation of sensory input to give it meaning.","points":["Interpretation and meaning"],"source":"2024:2","tip":"Sensation detects; perception interprets."},{"id":66,"group":"Memory","term":"Reception","definition":"Sensory receptor cells detect physical stimuli from the environment.","points":["Detect stimulus","receptors"],"source":"2024:2","tip":"Stage 1 of sensation."},{"id":67,"group":"Memory","term":"Transduction","definition":"Conversion of physical sensory energy into electrochemical neural signals.","points":["Convert stimulus to nerve signals"],"source":"2024:2","tip":"Stage 2 of sensation."},{"id":68,"group":"Memory","term":"Transmission","definition":"Neural signals are relayed along sensory pathways to the brain for processing.","points":["Relay signals","brain"],"source":"2024:2","tip":"Stage 3 of sensation."},{"id":69,"group":"Memory","term":"Selection (perception)","definition":"The brain attends to some sensory input rather than all available information.","points":["Attentional prioritisation"],"source":"SYL","tip":"First stage of perception."},{"id":70,"group":"Memory","term":"Organisation (perception)","definition":"Incoming sensory details are grouped and organised into coherent patterns or wholes.","points":["Grouping features","patterns"],"source":"2024:2","tip":"Gestalt grouping explains many examples."},{"id":71,"group":"Memory","term":"Interpretation (perception)","definition":"Meaning is assigned to organised sensory information using prior knowledge, context and experience.","points":["Give meaning","past experience"],"source":"2024:2","tip":"Two people can interpret one ambiguous image differently."},{"id":72,"group":"Memory","term":"Divided attention","definition":"Focusing on two or more stimuli or tasks at the same time.","points":["Attend to multiple stimuli simultaneously"],"source":"2024:2","tip":"Use all three elements for a three-mark definition."},{"id":73,"group":"Memory","term":"Selective attention","definition":"Directing attention to particular sensory information while filtering out competing stimuli.","points":["Focus relevant stimuli","suppress irrelevant"],"source":"2024:3","tip":"Study the concept, not the specific Cherry/Cocktail Party question."},{"id":74,"group":"Memory","term":"Memory","definition":"The mental processes of encoding, storing and retrieving information about experiences.","points":["Encoding","storage","retrieval"],"source":"2021:8","tip":"Use the three processes for a crisp definition."},{"id":75,"group":"Memory","term":"Encoding","definition":"Transforming incoming information into a representation that can enter memory.","points":["Transform info into memory code"],"source":"SYL","tip":"Semantic encoding generally supports meaningful retention."},{"id":76,"group":"Memory","term":"Storage","definition":"Maintaining encoded information in the memory system over time.","points":["Retention over time"],"source":"SYL","tip":"Remember storage is distinct from retrieval."},{"id":77,"group":"Memory","term":"Retrieval","definition":"Accessing previously encoded and stored information.","points":["Access from memory"],"source":"SYL","tip":"Recall, recognition and relearning are examinable."},{"id":78,"group":"Memory","term":"Multi-store model","definition":"Atkinson and Shiffrin's (1968) model proposing sensory, short-term and long-term memory stores, with information progressing through attention and rehearsal.","points":["Three stores","attention","rehearsal"],"source":"2025:2","tip":"Be able to compare duration, capacity and typical encoding."},{"id":79,"group":"Memory","term":"Sensory register","definition":"Initial, very brief store preserving sensory impressions; high capacity, modality-specific encoding.","points":["Very short duration","very high capacity","sensory encoding"],"source":"2025:2","tip":"Iconic visual traces are briefer than echoic auditory traces."},{"id":80,"group":"Memory","term":"Iconic memory","definition":"Brief visual sensory memory retaining an impression for a fraction of a second.","points":["Visual trace","very brief"],"source":"SYL","tip":"Sensory register subtype."},{"id":81,"group":"Memory","term":"Echoic memory","definition":"Brief auditory sensory memory retaining sounds for several seconds.","points":["Auditory trace","several seconds"],"source":"SYL","tip":"Sensory register subtype."},{"id":82,"group":"Memory","term":"Short-term memory (STM)","definition":"A limited-capacity store holding information briefly, commonly approximately 15–30 seconds without rehearsal.","points":["Brief duration","limited capacity"],"source":"2025:2","tip":"Typically acoustic/phonological encoding; meaning is possible."},{"id":83,"group":"Memory","term":"Long-term memory (LTM)","definition":"A relatively enduring store with very large capacity and potentially lifelong retention, often based on semantic encoding.","points":["Very large capacity","long duration","mainly semantic"],"source":"2025:2","tip":"Contrast all three characteristics with the sensory register."},{"id":84,"group":"Memory","term":"Explicit (declarative) memory","definition":"Long-term memories that can be consciously recalled and stated, including episodic and semantic memories.","points":["Conscious access","episodic","semantic"],"source":"2025:3","tip":"Use a personal event versus a general fact as examples."},{"id":85,"group":"Memory","term":"Implicit (non-declarative) memory","definition":"Long-term memory expressed through performance without necessarily conscious recollection, including procedures.","points":["Performance","non-conscious retrieval"],"source":"2025:3","tip":"Procedural memory is a syllabus example."},{"id":86,"group":"Memory","term":"Episodic memory","definition":"Explicit memory for personally experienced events situated in a time and place.","points":["Personal events","context"],"source":"2025:3","tip":"E.g., your graduation ceremony."},{"id":87,"group":"Memory","term":"Semantic memory","definition":"Explicit memory of facts, meanings and general knowledge, not tied to a particular episode.","points":["General factual knowledge"],"source":"2025:3","tip":"E.g., definition of the hippocampus."},{"id":88,"group":"Memory","term":"Procedural memory","definition":"Implicit memory for learned skills and how to perform actions.","points":["Skills","knowing how"],"source":"2025:3","tip":"E.g., tying shoelaces."},{"id":89,"group":"Memory","term":"Working memory model","definition":"Baddeley and Hitch's (1974), later expanded model of active, limited-capacity temporary processing with distinct subsystems.","points":["Active processing","multiple components"],"source":"2021:8","tip":"Contrast active WM with passive STM storage."},{"id":90,"group":"Memory","term":"Central executive","definition":"An attentional control system allocating processing resources and coordinating the other working-memory components.","points":["Attention","control","coordinates"],"source":"2021:8","tip":"Does not function as a large independent storage system."},{"id":91,"group":"Memory","term":"Phonological loop","definition":"Temporarily stores and rehearses speech-based and other verbal/auditory information.","points":["Verbal/auditory","rehearsal"],"source":"2021:8","tip":"Recall the phonological store and articulatory rehearsal process."},{"id":92,"group":"Memory","term":"Visuospatial sketchpad","definition":"Temporarily maintains and manipulates visual and spatial information.","points":["Visual images","spatial layouts"],"source":"2021:8","tip":"Imagine rotating a shape or finding your way home."},{"id":93,"group":"Memory","term":"Episodic buffer","definition":"Limited-capacity workspace integrating information across WM components and long-term memory into episodes.","points":["Integrates multimodal information and LTM"],"source":"SYL","tip":"Added by Baddeley (2000)."},{"id":94,"group":"Memory","term":"Hippocampus","definition":"Medial-temporal structure important for forming and consolidating new explicit long-term memories.","points":["New declarative memories","consolidation"],"source":"2024:4","tip":"Damage often impairs new episodic learning."},{"id":95,"group":"Memory","term":"Cerebellum","definition":"Brain structure supporting motor coordination and learned motor skills, contributing to procedural/implicit memory.","points":["Motor skills","implicit memory"],"source":"2024:4","tip":"Can remain functional when explicit memory is impaired."},{"id":96,"group":"Memory","term":"Amygdala","definition":"Brain structure involved in emotional learning, fear responses and attaching emotional significance to memories.","points":["Emotion","fear","emotional salience"],"source":"2024:4","tip":"2024 key explicitly tests three roles."},{"id":97,"group":"Memory","term":"Henry Molaison (H.M.)","definition":"A memory case study: bilateral medial-temporal surgery caused profound anterograde explicit-memory impairment while some procedural learning remained.","points":["Anterograde impairment","preserved skill learning"],"source":"SYL","tip":"Supports distinction between explicit and implicit systems."},{"id":98,"group":"Memory","term":"Free recall","definition":"Retrieving previously learned information without prompts or a required order.","points":["No retrieval cues","any order"],"source":"SYL","tip":"E.g., writing definitions from memory."},{"id":99,"group":"Memory","term":"Serial recall","definition":"Retrieving items in the particular order in which they were presented.","points":["Correct sequence required"],"source":"SYL","tip":"Used when order matters, e.g. a list of words."},{"id":100,"group":"Memory","term":"Cued recall","definition":"Retrieving previously learned information with a prompt or hint.","points":["Given retrieval cue"],"source":"SYL","tip":"Distinct from recognising the answer in a list."},{"id":101,"group":"Memory","term":"Recognition","definition":"Identifying previously encountered information when it is presented again among alternatives.","points":["Identify familiar stimulus"],"source":"2025:19","tip":"Usually easier than unaided recall."},{"id":102,"group":"Memory","term":"Relearning","definition":"Learning material again more quickly than the first time, demonstrating savings in memory.","points":["Faster subsequent learning"],"source":"SYL","tip":"Ebbinghaus used a savings-based approach."},{"id":103,"group":"Memory","term":"Levels-of-processing model","definition":"Craik and Lockhart's (1972) model: deeper, meaning-focused encoding generally improves later memory more than shallow analysis of surface features.","points":["Depth of encoding","retention"],"source":"2025:20","tip":"Structural → phonemic → semantic."},{"id":104,"group":"Memory","term":"Structural processing","definition":"Shallow encoding attending to an item's physical or visual characteristics.","points":["Appearance/case/shape"],"source":"2025:20","tip":"Ask: is the word in capitals?"},{"id":105,"group":"Memory","term":"Phonemic processing","definition":"Shallow/intermediate encoding attending to the sound or rhyming properties of information.","points":["Sound/rhyme"],"source":"2025:20","tip":"Ask: does a word rhyme?"},{"id":106,"group":"Memory","term":"Semantic processing","definition":"Deep encoding that analyses meaning and links information to knowledge, usually supporting better memory.","points":["Meaning","elaboration"],"source":"2025:20","tip":"Ask: does the word fit the sentence?"},{"id":107,"group":"Memory","term":"Craik and Tulving (1975) study","definition":"Participants made structural, phonemic or semantic judgements about words before an unexpected memory test; semantic judgements supported better recognition or recall.","points":["Aim","word-judgement method","semantic advantage"],"source":"2025:19","tip":"Limitations: processing time/effort; mechanism unclear. Contributions: educational approaches and memory as active."},{"id":108,"group":"Memory","term":"Maintenance rehearsal","definition":"Conscious repetition of information, primarily to keep it available in short-term memory.","points":["Repeat","STM maintenance"],"source":"2025:20","tip":"Not equivalent to deep elaborative encoding."},{"id":109,"group":"Memory","term":"Elaborative rehearsal","definition":"Linking new information meaningfully to existing knowledge to support longer-lasting memory.","points":["New–existing knowledge connections"],"source":"2025:20","tip":"Give a specific personalised example."},{"id":110,"group":"Memory","term":"Repetition (Ebbinghaus)","definition":"Review or re-exposure to the same information over time to support retention and relearning.","points":["Repeated exposure over time"],"source":"2025:20","tip":"2025 explicitly distinguishes repetition from two rehearsal styles."},{"id":111,"group":"Memory","term":"Forgetting curve","definition":"Ebbinghaus's pattern showing rapid early loss of retained material followed by a slower decline over time.","points":["Rapid initial decline","later flattening"],"source":"2024:6","tip":"Be able to describe a graph and the benefit of relearning."},{"id":112,"group":"Memory","term":"Retrieval failure","definition":"Forgetting because stored information cannot be accessed when needed.","points":["Present in LTM","inaccessible"],"source":"2025:7","tip":"Helpful cues may overcome it."},{"id":113,"group":"Memory","term":"Proactive interference","definition":"Previously learned information makes it harder to learn or retrieve newer information.","points":["Old disrupts new"],"source":"2021:8","tip":"Remember proactive = past blocks present."},{"id":114,"group":"Memory","term":"Retroactive interference","definition":"Newly learned information disrupts retrieval of older information.","points":["New disrupts old"],"source":"2021:8","tip":"Remember retroactive = recent blocks earlier."},{"id":115,"group":"Memory","term":"Motivated forgetting","definition":"Avoidance or blocking of recall of information associated with discomfort or distress.","points":["Avoid uncomfortable recall"],"source":"2025:7","tip":"Distinguish from naturally fading trace over time."},{"id":116,"group":"Memory","term":"Decay theory","definition":"Forgetting attributed to fading or loss of memory traces over time, particularly without use or rehearsal.","points":["Time passes","memory fades"],"source":"2025:7","tip":"Contrast with inaccessible but stored information."},{"id":117,"group":"Memory","term":"Chronic traumatic encephalopathy (CTE)","definition":"A neurodegenerative condition associated with repeated head impacts, involving abnormal tau accumulation and difficulties in memory, mood and behaviour.","points":["Repetitive trauma","tau changes"],"source":"SYL","tip":"Do not treat a single concussion as equivalent to confirmed CTE."},{"id":118,"group":"Memory","term":"Alzheimer's disease","definition":"Progressive neurodegeneration associated with amyloid plaques and abnormal tau neurofibrillary tangles, impairing memory and cognition.","points":["Neurodegeneration","memory decline"],"source":"2024:5","tip":"Link to deficits in recent learning, orientation and later memory."},{"id":119,"group":"Memory","term":"Wernicke–Korsakoff syndrome","definition":"A thiamine (vitamin B1) deficiency-related condition, frequently linked to prolonged alcohol misuse, causing severe memory impairment and possible confabulation.","points":["Thiamine deficiency","amnesia"],"source":"2024:5","tip":"Can include ataxia and abnormal eye movements."},{"id":120,"group":"Learning","term":"Learning","definition":"A relatively permanent change in behaviour or knowledge resulting from experience.","points":["Relatively enduring","experience"],"source":"2022:8","tip":"Differentiate reflexes and maturation from learned responses."},{"id":121,"group":"Learning","term":"Classical conditioning","definition":"Learning through association of stimuli so a previously neutral stimulus comes to elicit a conditioned response.","points":["Stimulus association","learnt response"],"source":"SYL","tip":"Pavlov (1902); Watson and Rayner (1920)."},{"id":122,"group":"Learning","term":"Neutral stimulus (NS)","definition":"A stimulus that initially does not produce the particular reflex response being studied.","points":["Initially no target response"],"source":"SYL","tip":"A bell before pairing with food."},{"id":123,"group":"Learning","term":"Unconditioned stimulus (UCS)","definition":"A stimulus that naturally produces an automatic, unlearned response.","points":["Natural stimulus"],"source":"SYL","tip":"Food that automatically produces salivation."},{"id":124,"group":"Learning","term":"Unconditioned response (UCR)","definition":"The natural, unlearned reflexive response to an unconditioned stimulus.","points":["Automatic response to UCS"],"source":"SYL","tip":"Salivation in response to food."},{"id":125,"group":"Learning","term":"Conditioned stimulus (CS)","definition":"A formerly neutral stimulus that produces a learned response after association with the UCS.","points":["Former NS","after pairing"],"source":"SYL","tip":"Bell after repeated pairings."},{"id":126,"group":"Learning","term":"Conditioned response (CR)","definition":"The learned response elicited by the conditioned stimulus.","points":["Learned response to CS"],"source":"SYL","tip":"Salivation to bell alone."},{"id":127,"group":"Learning","term":"Acquisition","definition":"Initial learning of the association during repeated pairings of NS with UCS.","points":["Association formed"],"source":"SYL","tip":"Order and timing of stimulus presentation matter."},{"id":128,"group":"Learning","term":"Stimulus generalisation","definition":"A conditioned response occurs to stimuli similar to the original conditioned stimulus.","points":["Similar stimuli","same learned response"],"source":"SYL","tip":"Child fears other furry animals."},{"id":129,"group":"Learning","term":"Stimulus discrimination","definition":"Learning to respond to the original CS but not to sufficiently different stimuli.","points":["Differentiate stimuli"],"source":"SYL","tip":"Fear of white rats but not white toys."},{"id":130,"group":"Learning","term":"Extinction (classical)","definition":"Reduction of a conditioned response when the CS is repeatedly presented without the UCS.","points":["CS alone","CR weakens"],"source":"2022:8","tip":"Extinction does not necessarily erase original learning."},{"id":131,"group":"Learning","term":"Spontaneous recovery","definition":"Reappearance of an extinguished conditioned response after a period of time without further pairing.","points":["CR returns after rest"],"source":"SYL","tip":"It may re-extinguish without reinforcement."},{"id":132,"group":"Learning","term":"Pavlov (1902) dogs study","definition":"Showed learned salivation responses when a neutral signal was repeatedly paired with food, demonstrating stimulus association.","points":["Method","learned response","contribution"],"source":"SYL","tip":"Consider limited transfer from simple animal reflexes to complex behaviour."},{"id":133,"group":"Learning","term":"Watson and Rayner (1920) Little Albert","definition":"Conditioned a fear response by pairing a white rat with a startling loud noise, highlighting acquired fear and serious ethical limitations.","points":["Fear association","infant","protection from harm"],"source":"SYL","tip":"Major criticisms: harm, consent, withdrawal, no proper deconditioning."},{"id":134,"group":"Learning","term":"Operant conditioning","definition":"Learning in which behaviour is shaped by the consequences that follow it.","points":["Behaviour","consequences","future frequency"],"source":"2025:4","tip":"Contrast with reflexive stimulus–stimulus associations."},{"id":135,"group":"Learning","term":"Antecedent","definition":"The event or stimulus occurring before a behaviour.","points":["Before behaviour"],"source":"2025:4","tip":"Part one of the ABC model."},{"id":136,"group":"Learning","term":"Behaviour (ABC)","definition":"The observable action that occurs in response to an antecedent.","points":["Observable response"],"source":"2025:4","tip":"Part two of the ABC model."},{"id":137,"group":"Learning","term":"Consequence","definition":"The event occurring after a behaviour that influences whether it recurs.","points":["After behaviour","effect"],"source":"2025:4","tip":"Part three of the ABC model."},{"id":138,"group":"Learning","term":"Positive reinforcement","definition":"Adding a desirable stimulus after behaviour to increase the probability of that behaviour recurring.","points":["Add stimulus","behaviour increases"],"source":"2021:10","tip":"Positive means added, not 'good'."},{"id":139,"group":"Learning","term":"Negative reinforcement","definition":"Removing an unpleasant stimulus after behaviour to increase the probability of that behaviour recurring.","points":["Remove stimulus","behaviour increases"],"source":"2022:8","tip":"Do not call it punishment."},{"id":140,"group":"Learning","term":"Positive punishment","definition":"Adding an aversive stimulus after a behaviour to reduce its future frequency.","points":["Add aversive","behaviour decreases"],"source":"SYL","tip":"E.g., a reprimand for interruption."},{"id":141,"group":"Learning","term":"Negative punishment","definition":"Removing a desirable stimulus after behaviour to decrease future behaviour.","points":["Remove desirable","behaviour decreases"],"source":"SYL","tip":"E.g., lose privileges for rule-breaking."},{"id":142,"group":"Learning","term":"Continuous reinforcement","definition":"Reinforcing each occurrence of a target behaviour.","points":["Every response"],"source":"SYL","tip":"Fast acquisition but often vulnerable to extinction."},{"id":143,"group":"Learning","term":"Fixed-ratio schedule (FR)","definition":"Reinforcement after a set number of responses.","points":["Count-based","fixed"],"source":"2025:4","tip":"E.g., reward after every fifth correct answer."},{"id":144,"group":"Learning","term":"Variable-ratio schedule (VR)","definition":"Reinforcement after an unpredictable number of responses, varying around an average.","points":["Count-based","unpredictable"],"source":"2025:4","tip":"Typically maintains persistent responding."},{"id":145,"group":"Learning","term":"Fixed-interval schedule (FI)","definition":"Reinforcement for the first target response after a fixed period has elapsed.","points":["Time-based","fixed"],"source":"2025:4","tip":"Response often rises just before reinforcement becomes available."},{"id":146,"group":"Learning","term":"Variable-interval schedule (VI)","definition":"Reinforcement for the first response after varying, unpredictable time intervals.","points":["Time-based","unpredictable"],"source":"SYL","tip":"Produces relatively steady responses."},{"id":147,"group":"Learning","term":"Thorndike's law of effect (1898)","definition":"Responses followed by satisfying consequences become more likely, while responses followed by unpleasant consequences become less likely.","points":["Consequence changes future behaviour"],"source":"SYL","tip":"Puzzle-box animal research contributed to operant theory."},{"id":148,"group":"Learning","term":"Skinner box (1938)","definition":"Operant chamber experiments recording animal responses to reinforcement and punishment, demonstrating effects of consequences and schedules.","points":["Controlled animal behaviour","consequences"],"source":"SYL","tip":"Strong control but limited ecological/general applicability."},{"id":149,"group":"Learning","term":"Social learning theory","definition":"Bandura's account of learning through observing models, with cognitive processes affecting whether behaviour is reproduced.","points":["Observation","cognitive factors"],"source":"2025:17","tip":"Observing a model need not automatically produce imitation."},{"id":150,"group":"Learning","term":"Attention (observational)","definition":"The observer notices and focuses on the model's behaviour and relevant features.","points":["Notice model"],"source":"2025:17","tip":"One of four required observational-learning processes."},{"id":151,"group":"Learning","term":"Retention (observational)","definition":"The observer remembers the modelled behaviour sufficiently to reproduce it later.","points":["Memory representation"],"source":"2025:17","tip":"No memory means imitation may not happen."},{"id":152,"group":"Learning","term":"Reproduction (observational)","definition":"The observer possesses the ability to physically or mentally perform the modelled action.","points":["Ability to perform"],"source":"2025:17","tip":"Motor capability or skills may prevent imitation."},{"id":153,"group":"Learning","term":"Motivation (observational)","definition":"The observer expects worthwhile consequences or otherwise has a reason to imitate the behaviour.","points":["Desire","expected outcome"],"source":"2025:17","tip":"Vicarious reinforcement can increase motivation."},{"id":154,"group":"Learning","term":"Vicarious reinforcement","definition":"Becoming more likely to imitate behaviour after observing someone else being rewarded for performing it.","points":["Observe another rewarded","imitation more likely"],"source":"2021:14","tip":"Different from receiving a reward personally."},{"id":155,"group":"Learning","term":"Bobo doll experiment (1961)","definition":"Bandura, Ross and Ross demonstrated that children who observed an aggressive adult model displayed more imitative aggression than comparison groups.","points":["Aim","conditions","model","aggressive behaviour"],"source":"2025:17","tip":"Ethical issues: exposing children to aggression and protection from harm."},{"id":156,"group":"Learning","term":"Systematic desensitisation","definition":"Behaviour modification for phobias using relaxation and gradual exposure to a graded fear hierarchy.","points":["Relax","rank fears","graded exposure"],"source":"2021:10","tip":"Link to reciprocal inhibition/counterconditioning and the target phobia."},{"id":157,"group":"Learning","term":"Token economy","definition":"Behaviour modification system awarding tokens for target behaviours; accumulated tokens are exchanged for valued backup rewards.","points":["Target behaviour","tokens","exchange for rewards"],"source":"2021:10","tip":"Limits: dependence on reward and generalisation outside system."},{"id":158,"group":"Motivation","term":"Motivation","definition":"The force or drive that gives purpose and direction to behaviour.","points":["Drive","direction of behaviour"],"source":"2025:13","tip":"Could be conscious or unconscious."},{"id":159,"group":"Motivation","term":"Physiological source of motivation","definition":"A biological drive from bodily needs such as hunger, thirst or sleep.","points":["Internal bodily need"],"source":"SYL","tip":"Contrast with social or cognitive sources."},{"id":160,"group":"Motivation","term":"Cognitive source of motivation","definition":"Beliefs, expectations, goals and interpretations that guide behaviour.","points":["Beliefs","goals","expectations"],"source":"SYL","tip":"E.g., studying because you expect improvement."},{"id":161,"group":"Motivation","term":"Emotional source of motivation","definition":"Feelings that energise, direct or discourage behaviours.","points":["Emotion","behavioural direction"],"source":"SYL","tip":"E.g., pride encourages continued effort."},{"id":162,"group":"Motivation","term":"Social source of motivation","definition":"Drive arising from interpersonal relationships, belonging, norms or social rewards.","points":["Peers","belonging","approval"],"source":"SYL","tip":"E.g., joining an activity to connect with friends."},{"id":163,"group":"Motivation","term":"Self-determination theory (SDT)","definition":"Deci and Ryan's theory linking quality of motivation and wellbeing to autonomy, competence and relatedness.","points":["Three needs","autonomy continuum"],"source":"2025:14","tip":"Explain the regulatory style and its locus of control in scenarios."},{"id":164,"group":"Motivation","term":"Autonomy (SDT)","definition":"The psychological need to feel a sense of choice and ownership over one's own actions.","points":["Choice","volition/control"],"source":"2025:14","tip":"Autonomy is not the same as total independence."},{"id":165,"group":"Motivation","term":"Competence (SDT)","definition":"The psychological need to feel capable, effective and able to master challenges.","points":["Effectiveness","mastery"],"source":"2025:14","tip":"Constructive feedback and achievable challenge can support it."},{"id":166,"group":"Motivation","term":"Relatedness (SDT)","definition":"The psychological need to feel connected, valued and a sense of belonging with others.","points":["Connection","belonging"],"source":"2025:14","tip":"Supportive teams satisfy relatedness."},{"id":167,"group":"Motivation","term":"Amotivation","definition":"A lack of intention or meaningful motivation to act.","points":["Lack of intention"],"source":"2025:13","tip":"At left of SDT continuum."},{"id":168,"group":"Motivation","term":"External regulation","definition":"Extrinsic motivation controlled by externally imposed rewards, punishments or demands.","points":["Outside incentive or consequence"],"source":"SYL","tip":"E.g., doing homework for money."},{"id":169,"group":"Motivation","term":"Introjected regulation","definition":"Extrinsic motivation driven by internal pressure such as guilt, shame or contingent self-worth.","points":["Internal pressure","guilt"],"source":"SYL","tip":"Partly internalised, but still controlled."},{"id":170,"group":"Motivation","term":"Identified regulation","definition":"Extrinsic motivation in which an activity is personally recognised as important or valuable.","points":["Personal value","chosen importance"],"source":"SYL","tip":"E.g., revising because exam success matters to your goals."},{"id":171,"group":"Motivation","term":"Integrated regulation","definition":"Extrinsic motivation where a valued action is fully aligned with identity and other personal values.","points":["Value integrated with identity"],"source":"SYL","tip":"Still extrinsic because activity is pursued for separable outcomes."},{"id":172,"group":"Motivation","term":"Intrinsic motivation","definition":"Engaging in a behaviour because the activity itself is enjoyable or interesting.","points":["Interest or enjoyment inherent in task"],"source":"2025:13","tip":"Strongest autonomous intrinsic pole of the continuum."},{"id":173,"group":"Motivation","term":"Autonomous motivation","definition":"Doing an activity willingly, with choice or personal endorsement (identified, integrated and intrinsic forms).","points":["Volition","internal endorsement"],"source":"SYL","tip":"Not the same as intrinsic alone."},{"id":174,"group":"Motivation","term":"Controlled motivation","definition":"Behaviour primarily driven by external demands or internalised pressure (external and introjected regulations).","points":["External pressure","guilt"],"source":"SYL","tip":"Distinguish introjected from identified regulation."},{"id":175,"group":"Motivation","term":"Maslow's deficiency needs","definition":"Lower needs arising from perceived deficits: physiological, safety, love/belonging and esteem.","points":["Four deficit levels"],"source":"SYL","tip":"Pressure to satisfy them diminishes once sufficiently met."},{"id":176,"group":"Motivation","term":"Maslow's growth needs","definition":"Needs motivated by development and fulfilment, especially self-actualisation in the original hierarchy.","points":["Self-development","growth"],"source":"SYL","tip":"Do not treat self-actualisation as a deficiency need."},{"id":177,"group":"Motivation","term":"Self-actualisation","definition":"The drive to realise and develop one's potential, capacities and personal fulfilment.","points":["Realise potential"],"source":"SYL","tip":"Can include creativity, authenticity and growth."},{"id":178,"group":"Motivation","term":"Maslow's expanded hierarchy (1970)","definition":"Extension of the original need hierarchy to include cognitive, aesthetic and transcendence needs alongside self-actualisation.","points":["Cognitive","aesthetic","transcendence"],"source":"SYL","tip":"Cognitive and aesthetic precede self-actualisation in common expanded diagrams; transcendence above."},{"id":179,"group":"Motivation","term":"Diener's subjective wellbeing (1984)","definition":"A person's cognitive and emotional evaluation of their life, comprising life satisfaction, positive affect and negative affect.","points":["Life satisfaction","positive affect","negative affect"],"source":"2025:11","tip":"High wellbeing: high positive, low negative affect and high satisfaction."},{"id":180,"group":"Motivation","term":"Life satisfaction (Diener)","definition":"The person's reflective, cognitive judgement of their overall quality of life.","points":["Cognitive evaluation"],"source":"2025:11","tip":"Distinguish from a temporary positive mood."},{"id":181,"group":"Motivation","term":"Positive affect (Diener)","definition":"The frequency or experience of pleasant emotional states such as joy and interest.","points":["Positive emotion frequency"],"source":"2025:11","tip":"Diener models how often positive affect occurs."},{"id":182,"group":"Motivation","term":"Negative affect (Diener)","definition":"The frequency or experience of unpleasant emotional states such as distress, anger and sadness.","points":["Negative emotion frequency"],"source":"2025:11","tip":"Low frequency supports higher subjective wellbeing."},{"id":183,"group":"Motivation","term":"Ryff's psychological wellbeing (1989)","definition":"A multidimensional model of positive psychological functioning involving six aspects of personal and social flourishing.","points":["Six dimensions of functioning"],"source":"2025:12","tip":"Know every dimension and a practical improvement for each."},{"id":184,"group":"Motivation","term":"Autonomy (Ryff)","definition":"Self-determination and self-directed behaviour that is consistent with personal convictions.","points":["Independent judgement","self-direction"],"source":"2025:12","tip":"Different model from autonomy as an SDT need."},{"id":185,"group":"Motivation","term":"Environmental mastery (Ryff)","definition":"The ability to manage life demands and shape or select environments that meet one's needs.","points":["Manage surroundings","demands"],"source":"2025:12","tip":"E.g., manage workload and resources effectively."},{"id":186,"group":"Motivation","term":"Personal growth (Ryff)","definition":"A sense of ongoing development, learning and fulfilment of potential.","points":["Ongoing growth","self-improvement"],"source":"2025:12","tip":"E.g., meaningful new skills and goals."},{"id":187,"group":"Motivation","term":"Positive relations (Ryff)","definition":"Having warm, trusting, satisfying and supportive relationships with other people.","points":["Warm trusting ties"],"source":"2025:12","tip":"Team-building may strengthen this dimension."},{"id":188,"group":"Motivation","term":"Purpose in life (Ryff)","definition":"Having meaningful goals and a sense that one's life has direction and significance.","points":["Goals","meaning and direction"],"source":"2025:12","tip":"Distinguish from environmental mastery."},{"id":189,"group":"Motivation","term":"Self-acceptance (Ryff)","definition":"A positive yet realistic attitude toward oneself, including acceptance of strengths and weaknesses.","points":["Realistic self-regard"],"source":"2025:12","tip":"Can be supported by inclusive environments."},{"id":190,"group":"Stress","term":"Stress (Selye)","definition":"The body's non-specific physiological response to demands placed upon it.","points":["Non-specific response","demands"],"source":"2025:15","tip":"Do not define only as an emotion."},{"id":191,"group":"Stress","term":"Eustress","definition":"A positive or beneficial psychological response to a stressor that can improve motivation or performance.","points":["Positive stress response","benefit"],"source":"2024:9","tip":"E.g., energised before a valued competition."},{"id":192,"group":"Stress","term":"Distress","definition":"A negative response to a stressor associated with feeling overwhelmed and reduced functioning.","points":["Negative stress response","impairment"],"source":"2024:9","tip":"Both eustress and distress involve demands."},{"id":193,"group":"Stress","term":"Psychological stressor","definition":"A mental or emotional demand such as fear of failure, worry or perceived loss of control.","points":["Mental/emotional trigger"],"source":"2024:9","tip":"Distinguish from social conflict or environmental noise."},{"id":194,"group":"Stress","term":"Environmental stressor","definition":"A demand arising from the physical environment, such as excessive noise, crowding or heat.","points":["Physical surroundings"],"source":"2024:9","tip":"Give a concrete, correctly classified example."},{"id":195,"group":"Stress","term":"Social stressor","definition":"A demand resulting from interactions or relationships, such as bullying or interpersonal conflict.","points":["Relationships","social demands"],"source":"2024:9","tip":"Classification depends on the source of the demand."},{"id":196,"group":"Stress","term":"Cultural stressor","definition":"A stress-inducing demand linked to cultural expectations, identity or adapting to unfamiliar cultural norms.","points":["Cultural norms","acculturation"],"source":"2024:9","tip":"Do not assume all people from one culture react alike."},{"id":197,"group":"Stress","term":"Internal stressor","definition":"A stressor arising within the individual, such as distressing thoughts or expectations.","points":["Within person"],"source":"SYL","tip":"Source is different from duration or intensity."},{"id":198,"group":"Stress","term":"External stressor","definition":"A stressor originating outside the individual, such as deadlines, noise or conflict.","points":["Outside person"],"source":"SYL","tip":"Can still be perceived differently by different people."},{"id":199,"group":"Stress","term":"Acute stressor","definition":"A short-lived or immediate demand with relatively limited duration.","points":["Short duration"],"source":"SYL","tip":"E.g., surprise oral presentation."},{"id":200,"group":"Stress","term":"Chronic stressor","definition":"A persistent, repeated or long-term demand.","points":["Prolonged duration"],"source":"SYL","tip":"E.g., sustained financial insecurity."},{"id":201,"group":"Stress","term":"Stressor intensity","definition":"The severity or strength of a demand placed on the individual.","points":["Mild–severe","intensity"],"source":"SYL","tip":"Intensity is a separate dimension from duration."},{"id":202,"group":"Stress","term":"Stress as a response","definition":"An approach focusing on physiological and psychological changes arising when the body encounters demands.","points":["Response to demands"],"source":"2025:15","tip":"Linked to Selye's GAS."},{"id":203,"group":"Stress","term":"General Adaptation Syndrome (GAS)","definition":"Selye's three-stage pattern of stress response: alarm, resistance and exhaustion under prolonged demands.","points":["Alarm","resistance","exhaustion"],"source":"2025:15","tip":"Explain physiological changes in order."},{"id":204,"group":"Stress","term":"Alarm: shock","definition":"The initial phase of alarm during which resistance may momentarily drop as the stressor is detected.","points":["Initial shock","temporary drop"],"source":"SYL","tip":"Do not skip shock and countershock where asked."},{"id":205,"group":"Stress","term":"Alarm: countershock","definition":"The fight-or-flight mobilisation phase involving sympathetic activity, adrenaline and increased heart/breathing rates.","points":["SNS mobilisation","heightened arousal"],"source":"SYL","tip":"Countershock follows shock in the alarm stage."},{"id":206,"group":"Stress","term":"Resistance stage","definition":"The body continues adapting to an ongoing stressor, with arousal sustained and resources expended.","points":["Ongoing adaptation","resource use"],"source":"2025:15","tip":"Heart rate may decline from the initial peak but remain elevated."},{"id":207,"group":"Stress","term":"Exhaustion stage","definition":"After prolonged stress, adaptive resources are depleted and vulnerability to illness or dysfunction increases.","points":["Resources depleted","reduced resistance"],"source":"2025:15","tip":"Prolonged exhaustion can harm health."},{"id":208,"group":"Stress","term":"Stress as a stimulus","definition":"An approach treating external events or changes as stressors that impose demands requiring adaptation.","points":["External events","demands for adjustment"],"source":"2024:9","tip":"Holmes and Rahe assess the impact of life events."},{"id":209,"group":"Stress","term":"Social Readjustment Scale","definition":"Holmes and Rahe's (1967) measure assigning life-change units to events according to their demands for adjustment.","points":["Life events","summed readjustment"],"source":"2024:9","tip":"Positive events may still create stress through readjustment."},{"id":210,"group":"Stress","term":"Stress as a transaction","definition":"Lazarus and Folkman's view that stress emerges from an ongoing interaction between a person and their environment, shaped by appraisal and coping resources.","points":["Person–environment relationship","appraisal"],"source":"SYL","tip":"Not just stimulus or response alone."},{"id":211,"group":"Stress","term":"Primary appraisal","definition":"Evaluating whether an event is irrelevant, benign-positive or stressful, and whether it poses harm/loss, threat or challenge.","points":["Meaning/threat evaluation"],"source":"SYL","tip":"Question: 'Does this matter, and how?'"},{"id":212,"group":"Stress","term":"Secondary appraisal","definition":"Evaluating available coping options, abilities, resources and perceived control over a demand.","points":["Coping resources/options"],"source":"SYL","tip":"Question: 'What can I do about it?'"},{"id":213,"group":"Stress","term":"Problem-focused coping","definition":"Actions intended to change, remove or directly manage the cause of stress.","points":["Address stressor itself"],"source":"SYL","tip":"E.g., make a study schedule or seek practical help."},{"id":214,"group":"Stress","term":"Emotion-focused coping","definition":"Actions aimed at regulating feelings caused by a stressor without necessarily changing the stressor.","points":["Manage emotional response"],"source":"SYL","tip":"E.g., relaxation or emotional support."},{"id":215,"group":"Stress","term":"Adaptive coping","definition":"Coping that effectively manages demands or emotions without creating significant additional harm.","points":["Effective long-term adjustment"],"source":"SYL","tip":"Depends on context; no one strategy is always best."},{"id":216,"group":"Stress","term":"Maladaptive coping","definition":"Coping that may offer immediate relief but worsens functioning or stress in the longer term.","points":["Short-term relief","longer-term costs"],"source":"SYL","tip":"E.g., avoidance that prolongs a solvable problem."},{"id":217,"group":"Sleep","term":"Sleep","definition":"A recurring state of altered consciousness with characteristic physiological activity and reduced responsiveness to surroundings.","points":["Altered consciousness","sleep physiology"],"source":"2024:10","tip":"REM can have high brain activity despite muscle atonia."},{"id":218,"group":"Sleep","term":"Circadian rhythm","definition":"An approximately 24-hour biological cycle regulating sleep–wake timing and other bodily functions.","points":["~24h biological cycle"],"source":"SYL","tip":"Light exposure helps synchronise the cycle."},{"id":219,"group":"Sleep","term":"Sleep–wake cycle","definition":"The repeating pattern of alertness and sleep across a day, influenced by circadian timing and sleep pressure.","points":["Daily sleeping and waking"],"source":"SYL","tip":"Different from an individual ~90-minute sleep cycle."},{"id":220,"group":"Sleep","term":"Sleep cycle","definition":"A recurring progression through NREM and REM stages lasting roughly 90 minutes, repeated several times across the night.","points":["~90 min","repeats"],"source":"SYL","tip":"NREM3 tends to be greater early; REM episodes lengthen later."},{"id":221,"group":"Sleep","term":"NREM stage 1","definition":"Light transitional sleep with theta-dominant, relatively low-amplitude waves, slow rolling eye movements and reduced muscle tone.","points":["Light transition","theta","some tone"],"source":"SYL","tip":"Easy to awaken; low-amplitude EEG."},{"id":222,"group":"Sleep","term":"NREM stage 2","definition":"Light sleep characterised by theta background activity, sleep spindles and K-complexes, with reduced tone and slower heart rate.","points":["Spindles","K-complexes","theta"],"source":"SYL","tip":"Recognise distinctive EEG features."},{"id":223,"group":"Sleep","term":"NREM stage 3","definition":"Deep slow-wave sleep marked by low-frequency, high-amplitude delta waves and reduced physiological activity.","points":["Delta","high amplitude","low frequency"],"source":"SYL","tip":"Hardest NREM stage to awaken from; slow-wave sleep."},{"id":224,"group":"Sleep","term":"REM sleep","definition":"Sleep with low-amplitude mixed-frequency, wake-like EEG, rapid eye movements, vivid dreaming and very low skeletal-muscle tone.","points":["Rapid eyes","atonia","active EEG"],"source":"2024:10","tip":"Do not call it 'deeper than NREM3'."},{"id":225,"group":"Sleep","term":"Electroencephalogram (EEG)","definition":"An objective physiological recording of electrical activity from the scalp used to assess brainwave patterns and sleep stages.","points":["Brainwave activity","scalp electrodes"],"source":"2024:12","tip":"EEG brainwaves are not muscle activity."},{"id":226,"group":"Sleep","term":"Electromyogram (EMG)","definition":"A recording of muscle electrical activity used to assess muscle tone during sleep.","points":["Muscle electrical activity"],"source":"2024:12","tip":"REM commonly features muscle atonia."},{"id":227,"group":"Sleep","term":"Electrooculogram (EOG)","definition":"A recording of eye movements using electrodes, useful in differentiating REM from NREM.","points":["Eye movements"],"source":"2024:12","tip":"Rapid eyes are diagnostic of REM."},{"id":228,"group":"Sleep","term":"Restorative purpose of sleep","definition":"The view that sleep helps repair and replenish the body and brain, supporting recovery and energy restoration.","points":["Repair","replenish"],"source":"2024:10","tip":"Includes repair, growth and replenishment of neurotransmitters."},{"id":229,"group":"Sleep","term":"Evolutionary purpose of sleep","definition":"The view that sleep evolved to improve survival by conserving energy and reducing exposure to danger during vulnerable periods.","points":["Energy conservation","survival"],"source":"2024:10","tip":"Contrast with the restorative account."},{"id":230,"group":"Sleep","term":"Sleep deprivation","definition":"Insufficient quantity or quality of sleep to support normal functioning.","points":["Insufficient/poor sleep","reduced functioning"],"source":"2025:9","tip":"Define with both quantity/quality and functional impact."},{"id":231,"group":"Sleep","term":"Acute sleep deprivation","definition":"A brief or recent period of inadequate sleep that may impair mood, attention, reflex speed and vision.","points":["Short-term restriction","immediate impairments"],"source":"2025:9","tip":"Contrast with long-term health consequences."},{"id":232,"group":"Sleep","term":"Chronic sleep deprivation","definition":"Persistent insufficient or poor-quality sleep over an extended period, linked to mood and health problems.","points":["Long duration","cumulative impact"],"source":"2025:9","tip":"Syllabus links to obesity, heart disease, insomnia and anxiety."},{"id":233,"group":"Sleep","term":"Sleep latency","definition":"The amount of time taken to fall asleep after trying to sleep.","points":["Time to fall asleep"],"source":"2024:14","tip":"Shorter latency may indicate easier sleep onset, depending on context."},{"id":234,"group":"Sleep","term":"Sleep hygiene","definition":"Regular behaviours and environmental practices that support quality sleep.","points":["Consistent routine","environment","screen management"],"source":"SYL","tip":"Apply to real circumstances."},{"id":235,"group":"Sleep","term":"He et al. (2020) study","definition":"Study of reducing pre-bed smartphone use: 38 poor sleepers who used phones before bed were assigned to restriction or control; restriction lasted four weeks, with a 30-minute phone-free period before bed.","points":["Aim","38","4 weeks","30 min","outcomes"],"source":"2024:13","tip":"Describe measured sleep, arousal, mood and working memory; consider small/convenience sample."},{"id":236,"group":"Sleep","term":"Heart rate (sleep)","definition":"Heart rate tends to slow across NREM sleep and is more variable during REM sleep.","points":["Reduced NREM","variable REM"],"source":"2024:10","tip":"Describe physiological trends rather than invented precise bpm."},{"id":237,"group":"Sleep","term":"Muscle tone (sleep)","definition":"Skeletal-muscle tension generally decreases through NREM and is markedly suppressed during REM sleep.","points":["NREM reduced","REM near paralysis"],"source":"2024:10","tip":"Key term: REM atonia."},{"id":238,"group":"Sleep","term":"REM pattern across the night","definition":"REM periods generally lengthen later in the night, while deep NREM3 sleep predominates earlier.","points":["REM increases","NREM3 decreases"],"source":"SYL","tip":"Both stages can recur through multiple cycles."}];
const DRILLS=[{"topic":"Inquiry","difficulty":"Core","title":"Operational hypothesis","prompt":"A researcher compares sleep duration after 30 minutes of phone use before bed with no phone use. Write a directional operational hypothesis about sleep latency for Year 12 students.","marks":5,"source":"2022:2","criteria":["Identify the population (Year 12 students).","Identify both levels of the IV (phone use versus no phone use).","State the DV (sleep latency).","Predict a direction (e.g. longer latency with phone use).","Operationalise measurement (minutes taken to fall asleep)."],"exemplar":"Year 12 students who use their phone for 30 minutes before bed will take more minutes to fall asleep (longer sleep latency) than Year 12 students who do not use their phone before bed."},{"topic":"Memory","difficulty":"Core","title":"Three processes of sensation","prompt":"Name and outline all three processes of sensation. (6 marks)","marks":6,"source":"2024:2","criteria":["Name reception.","Explain that sensory receptors detect stimuli.","Name transduction.","Explain conversion of a stimulus into neural signals.","Name transmission.","Explain that neural signals are relayed to the brain."],"exemplar":"Reception: sensory receptors detect physical stimuli. Transduction: receptor cells convert the stimuli into neural signals. Transmission: the neural signals are relayed to the brain for subsequent processing."},{"topic":"Memory","difficulty":"Core","title":"Four types of forgetting","prompt":"Identify and outline four types of forgetting. (8 marks)","marks":8,"source":"2025:7","criteria":["Name retrieval failure.","Explain that stored information cannot be accessed.","Name interference.","Explain that other learnt material disrupts learning or retrieval.","Name motivated forgetting.","Explain avoiding recall of distressing information.","Name decay.","Explain information fades over time."],"exemplar":"Retrieval failure occurs when information remains stored but cannot be accessed. Interference occurs when competing information disrupts learning or retrieval; proactive involves older material affecting newer information, while retroactive is the reverse. Motivated forgetting involves blocking recall of information associated with discomfort. Decay theory attributes forgetting to fading of information over time."},{"topic":"Memory","difficulty":"Challenge","title":"Craik and Tulving study","prompt":"Outline Craik and Tulving’s (1975) aim, method and two key findings. (7 marks)","marks":7,"source":"2025:19","criteria":["State aim: effect of depth of processing on memory.","Mention a series of 10 experiments.","Describe yes/no word-judgement tasks.","Distinguish structural/case, phonemic/rhyming and semantic/sentence judgements.","Mention unexpected memory test using recall or recognition.","Finding: memory related to type of judgement.","Finding: meaning-focused judgements led to greater retention."],"exemplar":"Craik and Tulving (1975) investigated whether depth of word processing influenced memory performance. Across 10 experiments, participants answered yes/no questions about physical features, sound/rhyme or semantic meaning of words before unexpected recall or recognition tests. Memory depended strongly on type of judgement, with semantic processing producing superior performance to phonemic and structural processing."},{"topic":"Memory","difficulty":"Challenge","title":"Craik and Tulving evaluation","prompt":"Describe one limitation and identify three contributions of Craik and Tulving’s (1975) study. (5 marks)","marks":5,"source":"2025:19","criteria":["Name a legitimate limitation (e.g., processing time/effort not separated from depth).","Explain how it limits interpretation of results.","Contribution: emphasised memory as active processing.","Contribution: demonstrated benefits of semantic processing.","Contribution: informed learning/education or approaches to memory support."],"exemplar":"The study did not adequately separate greater processing time and effort from depth of encoding, so stronger memory may partly reflect effort rather than depth alone. It supported memory as an active process, demonstrated the value of semantic encoding and informed educational approaches that encourage meaningful engagement with information."},{"topic":"Learning","difficulty":"Core","title":"Pavlov in marking-key terms","prompt":"Describe Pavlov’s study: aim, three method steps and main finding. (5 marks)","marks":5,"source":"2024:16","criteria":["Aim: condition dogs to salivate in response to sound not originally linked with food.","Explain measuring saliva (e.g. cannula).","Describe neutral signal paired with food (UCS).","Mention repeated pairings.","Finding: signal alone elicited conditioned salivation."],"exemplar":"Pavlov investigated whether dogs could learn to salivate to a sound. Saliva was measured as a neutral sound was repeatedly paired with food, which naturally elicited salivation. After conditioning, the sound alone, now a conditioned stimulus, produced salivation as a conditioned response."},{"topic":"Learning","difficulty":"Core","title":"Operant ABC model","prompt":"A student sees an exam reminder, revises for 25 minutes and receives praise. Identify and explain the antecedent, behaviour and consequence. (6 practice marks)","marks":6,"source":"2025:4","criteria":["Correctly name antecedent.","Define antecedent as what happens before behaviour and link to reminder.","Correctly name behaviour.","Describe observable action and link to revision.","Correctly name consequence.","Describe event after behaviour and link to praise."],"exemplar":"Antecedent: the reminder appears before the action. Behaviour: the student revises for 25 minutes, which is observable. Consequence: the student receives praise following revision, which may increase future revision through positive reinforcement."},{"topic":"Learning","difficulty":"Challenge","title":"Bobo doll research","prompt":"State the aim, summarise three main stages in the procedure and describe one key finding of Bandura, Ross and Ross (1961). (5 marks)","marks":5,"source":"2025:17","criteria":["Aim: whether children learn aggression through observation.","Describe aggressive-model, non-aggressive-model and no-model comparison conditions.","Describe mild frustration/aggression-arousal stage.","Describe observation in test room with toys for approximately 20 minutes.","Finding: aggressive-model exposure led to more imitative aggression / same-sex modelling effect."],"exemplar":"Bandura, Ross and Ross (1961) tested whether observing adults encouraged aggression in children. Children were assigned to aggressive, non-aggressive or control conditions, underwent a mild frustration phase and were observed during play with toys. Those exposed to aggressive models displayed more imitative aggression, providing evidence for observational learning."},{"topic":"Motivation","difficulty":"Core","title":"Three SDT psychological needs","prompt":"Define the three psychological needs proposed by Deci and Ryan. (3 marks)","marks":3,"source":"2025:14","criteria":["Autonomy: control or volition over own actions.","Competence: mastery or effectiveness in activities.","Relatedness: connectedness or belonging with others."],"exemplar":"Autonomy is the need to feel choice and control over one’s behaviour. Competence is the need to feel effective and master activities. Relatedness is the need to feel socially connected and to belong."},{"topic":"Motivation","difficulty":"Core","title":"Ryff’s six dimensions","prompt":"List all six dimensions of Ryff’s (1989) psychological wellbeing model. (6 marks)","marks":6,"source":"2025:12","criteria":["Autonomy.","Environmental mastery.","Personal growth.","Positive relations with others.","Purpose in life.","Self-acceptance."],"exemplar":"Autonomy; environmental mastery; personal growth; positive relations with others; purpose in life; self-acceptance."},{"topic":"Motivation","difficulty":"Core","title":"Diener’s wellbeing model","prompt":"Summarise Diener’s (1984) model of subjective wellbeing. (5 marks)","marks":5,"source":"2025:11","criteria":["Name subjective wellbeing.","Explain cognitive and affective evaluations of life.","Mention frequent positive affect.","Mention infrequent negative affect.","Mention life satisfaction as cognitive evaluation."],"exemplar":"Diener’s subjective wellbeing model describes people’s cognitive and affective assessments of their lives. Wellbeing is generally higher when a person experiences frequent positive affect, infrequent negative affect and high cognitive life satisfaction."},{"topic":"Stress","difficulty":"Core","title":"Four stressor categories","prompt":"List four categories of stressors and give an original example of each. (8 practice marks)","marks":8,"source":"2024:9","criteria":["Identify psychological stressor.","Give psychological example, e.g., fear of failure.","Identify environmental stressor.","Give physical example, e.g., loud construction noise.","Identify social stressor.","Give interpersonal example, e.g., conflict with friend.","Identify cultural stressor.","Give cultural example, e.g., pressure to follow conflicting cultural expectations."],"exemplar":"Psychological: anxiety about possible exam failure. Environmental: loud construction noise. Social: conflict with a friend. Cultural: stress from navigating conflicting family and community expectations."},{"topic":"Stress","difficulty":"Challenge","title":"GAS: interpret physiological evidence","prompt":"In a prolonged laboratory stress exposure, heart rate rises sharply in the first hour, remains moderately elevated through the next day, then declines after three more days. Use Selye’s GAS to explain all three phases. (9 practice marks)","marks":9,"source":"2025:15","criteria":["Identify alarm stage.","Identify early fight-or-flight / sympathetic activation.","Apply increase in heart rate.","Identify resistance stage.","Explain continued coping with o
