ngoing demand.","Apply still-elevated but reduced heart rate.","Identify exhaustion stage.","Explain depleted resources after prolonged demand.","Apply subsequent decline and vulnerability."],"exemplar":"Initially the alarm stage activates sympathetic fight-or-flight responses, sharply increasing heart rate. During resistance, the body continues adapting, so heart rate may fall from its peak but remain above baseline while resources are consumed. With prolonged stress the exhaustion stage occurs as resources become depleted and physiological resistance declines."},{"topic":"Sleep","difficulty":"Core","title":"REM physiology","prompt":"Name the sleep stage associated with most vivid dreaming and state four physiological characteristics. (5 marks)","marks":5,"source":"2024:10","criteria":["Identify REM.","High/wake-like brain activity.","Rapid eye movements.","Marked reduction in muscle tone / atonia.","Variable or increased heart rate."],"exemplar":"REM sleep involves wake-like, high mixed-frequency brain activity, rapid eye movements, near-paralysis of most skeletal muscles, and variable heart rate. Vivid dreams are common."},{"topic":"Sleep","difficulty":"Core","title":"He et al. (2020) intervention","prompt":"Outline six features of the He et al. (2020) bedtime-phone intervention. (6 marks)","marks":6,"source":"2024:13","criteria":["Participants randomly assigned to intervention or control group.","Restriction group reduced bedtime phone use.","Control group received no restriction.","Intervention lasted four weeks.","Data measured before and after intervention.","Restriction applied for 30 minutes before bed."],"exemplar":"Participants were allocated to a group avoiding phone use during the 30 minutes before bed, or an unrestricted control group, for four weeks. Sleep and related measures were collected before and after the intervention."},{"topic":"Sleep","difficulty":"Core","title":"He et al.: three limitations","prompt":"Explain one methodological limitation of He et al. (2020), then propose a corresponding improvement. (5 practice marks)","marks":5,"source":"2024:14","criteria":["Identify specific limitation, e.g. small or convenience sample.","Describe why sample is restricted or biased.","Explain lower generalisability.","Propose a larger, more representative sample.","Explain that it improves generalisability."],"exemplar":"He et al. used a relatively small convenience sample of people with poor sleep who used phones before bed. This reduces confidence in generalising the findings to all adults. Recruit a larger, randomly or stratified-sampled group with more diverse sleep habits to improve representativeness and generalisability."},{"topic":"Inquiry","difficulty":"Core","title":"Research reliability","prompt":"Explain reliability and describe one way to improve it in a study measuring how much students sleep. (4 marks)","marks":4,"source":"2025:5","criteria":["Define consistency/stability of results.","Specify comparable conditions in repeat testing.","Propose standardised instructions or reliable tool.","Explain how it produces consistent measurements."],"exemplar":"Reliability refers to the consistency of results when a measure is used under similar conditions. Using a validated sleep diary with identical prompts and recording times for all students improves consistency by reducing differences caused by the measurement procedure."}];
const HIGH={"Inquiry": ["Operational hypothesis", "Independent variable (IV)", "Dependent variable (DV)", "Extraneous variable", "Confounding variable", "Random sampling", "Random allocation", "Internal validity", "External validity", "Reliability (general)", "Generalisability", "Informed consent", "Inter-rater reliability", "Ethics committee"], "Memory": ["Sensation", "Perception", "Working memory model", "Central executive", "Episodic buffer", "Hippocampus", "Amygdala", "Craik and Tulving (1975) study", "Semantic processing", "Proactive interference", "Retroactive interference", "Alzheimer's disease"], "Learning": ["Classical conditioning", "Unconditioned stimulus (UCS)", "Conditioned stimulus (CS)", "Operant conditioning", "Negative reinforcement", "Positive punishment", "Variable-ratio schedule (VR)", "Social learning theory", "Vicarious reinforcement", "Bobo doll experiment (1961)", "Token economy"], "Motivation": ["Self-determination theory (SDT)", "Introjected regulation", "Identified regulation", "Integrated regulation", "Autonomy (SDT)", "Competence (SDT)", "Relatedness (SDT)", "Diener's subjective wellbeing (1984)", "Ryff's psychological wellbeing (1989)", "Maslow's deficiency needs"], "Stress": ["Stress (Selye)", "Psychological stressor", "Cultural stressor", "Alarm: shock", "Alarm: countershock", "Resistance stage", "Exhaustion stage", "Primary appraisal", "Secondary appraisal", "Social Readjustment Scale"], "Sleep": ["NREM stage 2", "NREM stage 3", "REM sleep", "Acute sleep deprivation", "Chronic sleep deprivation", "He et al. (2020) study", "Sleep latency", "REM pattern across the night"]};
const PDFS={"2021": "2021_PSY_Ratified_Marking_Key.pdf", "2022": "2022-PSY-Ratified-Marking-key-Web-version.pdf", "2023": "2023-PSY-Ratified-Marking-Key.pdf", "2024": "2024-PSY-Ratified-Marking-Key-Web-Version.pdf", "2025": "2025-PSY-Ratified-Marking-Key.pdf"};
const GROUPS=['Inquiry','Memory','Learning','Motivation','Stress','Sleep'];
const GROUP_NAMES={Inquiry:'Science Inquiry',Memory:'Memory & Cognition',Learning:'Learning & Behaviour',Motivation:'Motivation & Wellbeing',Stress:'Stress & Coping',Sleep:'Sleep & Health'};
const BLOCKS=[['Inquiry',14,'Research design, validity & ethics'],['Memory',11,'Memory models, forgetting & Craik'],['Learning',10,'Conditioning, models & studies'],['Motivation',9,'SDT, Maslow, Diener & Ryff'],['Stress',8,'GAS, appraisals & stressors'],['Sleep',6,'Stages, deprivation & He et al.'],['Mix',2,'Correct your weakest three terms']];
const HIGH_IDS=new Set(TERMS.filter(x=>(HIGH[x.group]||[]).includes(x.term)).map(x=>x.id));
const NAV=[['sprint','60-min plan','◷'],['glossary','Term bank','▦'],['cards','Recall cards','▤'],['drills','Marking lab','✓'],['sources','Source keys','⌕']];
const ICONS={sprint:'<path d="M12 2v4m0 6 4 2M3.5 6a9 9 0 1 1-1 9"/><circle cx="12" cy="12" r="8"/>',glossary:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M12 9h6M12 13h6"/>',cards:'<rect x="5" y="3" width="15" height="17" rx="2"/><path d="M2 7v14h15"/>',drills:'<path d="m5 12 4 4L19 6"/><rect x="2" y="2" width="20" height="20" rx="4"/>',sources:'<path d="M4 19h16M6 17V4h12v13M8 8h8M8 12h8"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICONS[name]||ICONS.cards}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let persisted={};try{persisted=JSON.parse(localStorage.getItem('wace-psych-2026-v3')||'{}')}catch(e){}
const S={view:'sprint',topic:'All',query:'',onlyHigh:false,onlyKey:false,status:persisted.status||{},dark:!!persisted.dark,deck:[],index:0,reveal:false,drillIndex:0,showMark:false,showExemplar:false,checks:{},block:0,remaining:BLOCKS[0][1]*60,running:false,endAt:0,started:false};
function save(){try{localStorage.setItem('wace-psych-2026-v3',JSON.stringify({status:S.status,dark:S.dark}))}catch(e){}}
function knownCount(){return Object.values(S.status).filter(s=>s==='know').length}
function reviewedCount(){return Object.values(S.status).filter(s=>s==='know'||s==='revise').length}
function sourceMeta(s){if(s==='SYL')return{kind:'syllabus',label:'Syllabus-aligned',url:'',year:''};let [year,page]=s.split(':');return{kind:'official',label:`${year} key · p. ${page}`,year,url:`sources/${PDFS[year]}#page=${page}`}}
function srclink(s){const x=sourceMeta(s);return x.kind==='official'?`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener" title="PDF provided in the offline pack">↗ ${esc(x.label)}</a>`:`<span class="pill syl">Syllabus-aligned</span>`}
function labelSection(t,sub){return `<div class="page-top"><div><div class="kicker">${esc(sub)}</div><h1>${esc(t)}</h1></div></div>`}
function changeView(v){S.view=v;S.showMark=false;S.showExemplar=false;render();window.scrollTo({top:0,behavior:'instant'})}
function renderNav(){document.querySelector('#desktop-nav').innerHTML=NAV.map(([v,l])=>`<button data-action="navigate" data-view="${v}" class="navbutton ${S.view===v?'active':''}">${svg(v)} ${esc(l)}</button>`).join('');document.querySelector('#mobile-nav').innerHTML=NAV.map(([v,l])=>`<button data-action="navigate" data-view="${v}" aria-label="${esc(l)}" class="${S.view===v?'active':''}">${svg(v)}<span>${esc(v==='glossary'?'Terms':v==='cards'?'Cards':v==='sprint'?'Plan':v==='drills'?'Practice':'Sources')}</span></button>`).join('')}
function render(){document.documentElement.classList.toggle('dark',S.dark);document.querySelector('#themeBtn').textContent=S.dark?'☀':'☾';document.querySelector('#knownHeader').textContent=knownCount();let tm=document.querySelector('#miniTimer');tm.textContent=(S.running?'❚❚ ':S.remaining===0?'✓ ':'▶ ')+clock(S.remaining);tm.title=S.running?'Pause timer':'Start timer';renderNav();document.querySelector('#main').innerHTML=({sprint:renderSprint,glossary:renderGlossary,cards:renderCards,drills:renderDrills,sources:renderSources}[S.view])();}
const counts=Object.fromEntries(GROUPS.map(g=>[g,TERMS.filter(x=>x.group===g).length]));
function renderSprint(){return `<div class="hero panel"><div><span class="kicker">A little focus goes a long way</span><h2>Your one-hour WACE Psychology power session.</h2><p>Designed for graduation waiting time. Retrieve, check the SCSA criteria, and move on. You don't need to complete all ${TERMS.length} terms today.</p><div class="hero-actions"><button class="btn primary" data-action="start-block" data-index="0">Start the first 14 minutes →</button><button class="btn" data-action="navigate" data-view="glossary">Browse definitions</button></div></div><div class="hero-visual"><div class="time-orbit"><b>60</b><small>minutes</small></div></div></div>
<div class="statsgrid"><div class="panel statcard"><b>${TERMS.length}</b><span>Definitions across Unit 3 + 4</span></div><div class="panel statcard"><b>${HIGH_IDS.size}</b><span>Priority recall terms</span></div><div class="panel statcard"><b>${reviewedCount()}</b><span>Terms attempted</span></div></div>
<div class="sectionheading"><h2>Timed study blocks</h2><span class="footnote">60 minutes in total · tap a block to start</span></div>
<div class="cols"><div class="blocklist">${BLOCKS.map(([g,m,desc],i)=>`<div class="panel block"><div class="number">${String(i+1).padStart(2,'0')}</div><div><b>${g==='Mix'?'Final retrieval & weak spots':GROUP_NAMES[g]}</b><small>${esc(desc)}</small></div><div class="block-right"><b>${m} min</b><br><button class="btn sm ${S.block===i?'soft':''}" data-action="start-block" data-index="${i}">${S.block===i?'Resume topic':'Open block'} →</button></div></div>`).join('')}</div><div><div class="panel timerpanel"><span class="kicker">Your study timer</span><h3 id="blockName" style="margin-top:7px">${esc(S.block===6?'Final retrieval':GROUP_NAMES[BLOCKS[S.block][0]])}</h3><div class="timerbig" id="timerText">${clock(S.remaining)}</div><div class="timer-icon">${S.running?'COUNTING DOWN':'READY WHEN YOU ARE'} · ${BLOCKS[S.block][1]}-MINUTE BLOCK</div><div class="progress-track" style="margin:17px 0"><div id="timerFill" class="progress-fill" style="width:${100*(1-S.remaining/(BLOCKS[S.block][1]*60))}%"></div></div><div class="timer-actions"><button class="btn primary" data-action="timer">${S.running?'Pause timer':'▶ Start timer'}</button><button class="btn" data-action="timer-reset">↻ Reset</button></div><div class="divider"></div><div class="note"><b>How to study:</b> Say the definition from memory, reveal the key wording, then mark it <b>Know</b> or <b>Review</b>. Spend extra time only on misses. Don't study during the ceremony itself.</div></div><div class="panel pad" style="margin-top:14px"><h3>Mastery progress</h3><div class="progress-track"><div class="progress-fill" style="width:${Math.round(100*knownCount()/TERMS.length)}%"></div></div><p style="font-size:12px;margin:9px 0 0">${knownCount()} known · ${Object.values(S.status).filter(x=>x==='revise').length} need another review · progress saves automatically on this device.</p></div></div></div>`}
function termsFiltered(){let q=S.query.toLowerCase().trim();return TERMS.filter(x=>(S.topic==='All'||x.group===S.topic)&&(!S.onlyHigh||HIGH_IDS.has(x.id))&&(!S.onlyKey||x.source!=='SYL')&&(!q||`${x.term} ${x.definition} ${x.points.join(' ')} ${x.group}`.toLowerCase().includes(q)))}
function sourceBadge(x){return x.source==='SYL'?'<span class="pill syl">Syllabus</span>':`<span class="pill key">${esc(sourceMeta(x.source).label)}</span>`}
function filterToolbar(mode){return `<div class="toolbar">${mode==='glossary'?`<input id="termSearch" class="search" aria-label="Search psychological terms" placeholder="Search terms, definitions or marking phrases…" value="${esc(S.query)}"/>`:''}<select id="topicSelect" aria-label="Select topic"><option value="All" ${S.topic==='All'?'selected':''}>All topics</option>${GROUPS.map(g=>`<option value="${g}" ${S.topic===g?'selected':''}>${esc(GROUP_NAMES[g])} · ${counts[g]}</option>`).join('')}</select><label class="toggle"><input type="checkbox" id="highOnly" ${S.onlyHigh?'checked':''}>High-yield only</label><label class="toggle"><input type="checkbox" id="keyOnly" ${S.onlyKey?'checked':''}>Marking-key linked</label></div>`}
function renderGlossary(){const rs=termsFiltered();return `${labelSection('The terminology bank','exam-ready definitions')}<p class="lede">Every definition is written for rapid recall. <b>2021–2025 key</b> labels indicate the official key location used to ground or align the entry. <b>Syllabus</b> labels indicate a study explanation for an examinable 2026 syllabus term, not a verbatim SCSA definition.</p>${filterToolbar('glossary')}<div class="resultbar"><span>${rs.length} of ${TERMS.length} terms</span><span>Know: ${knownCount()} · Review: ${Object.values(S.status).filter(x=>x==='revise').length}</span></div><div class="termgrid" id="termResults">${rs.length?rs.map(termBox).join(''):`<div class="panel empty">No matching terms. Try another topic or clear the filters.</div>`}</div>`}
function termBox(x){let st=S.status[x.id];return `<article class="panel termcard ${st==='know'?'is-known':st==='revise'?'is-weak':''}"><div class="tags"><span class="pill">${esc(GROUP_NAMES[x.group])}</span>${HIGH_IDS.has(x.id)?'<span class="pill high">Priority</span>':''}</div><h3>${esc(x.term)}</h3><p>${esc(x.definition)}</p><div class="foot">${srclink(x.source)}<div class="actions"><button class="btn sm ${st==='revise'?'warn':''}" data-action="status" data-id="${x.id}" data-status="revise" title="Mark for later review">↻ Review</button><button class="btn sm ${st==='know'?'soft':''}" data-action="status" data-id="${x.id}" data-status="know" title="Mark as known">✓ Know</button></div></div></article>`}
function newDeck(shuffle=false){S.deck=termsFiltered().map(x=>x.id);if(shuffle){for(let i=S.deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]}}S.index=0;S.reveal=false}
function renderCards(){if(!S.deck.length)newDeck();let x=TERMS[S.deck[Math.max(0,Math.min(S.index,S.deck.length-1))]],n=S.deck.length;return `${labelSection('Recall, don’t reread','active recall cards')}<p class="lede">Look at the term first. Mentally recite the definition, then reveal the examiner-friendly points. Use ← / → to navigate and Space to flip.</p>${filterToolbar('cards')}<div class="stack" style="justify-content:space-between;margin:2px 0 14px"><span class="footnote">${n?`${S.index+1} of ${n} cards`:'No cards in this deck'} · timer ${clock(S.remaining)}</span><div class="stack"><button class="btn sm" data-action="fresh-deck">↻ Refresh selection</button><button class="btn sm" data-action="shuffle">⇄ Shuffle</button></div></div>${!x?`<div class="panel empty">No cards match these filters. Choose a different topic.</div>`:`<div class="flip-shell"><div class="flashcard ${S.reveal?'back':''}" role="button" tabindex="0" data-action="flip" aria-label="${S.reveal?'Show term':'Reveal definition'}"><span class="numbertag">${S.index+1}/${n}</span><span class="pill ${S.reveal?'key':''}">${S.reveal?'Definition + criteria':'What does this term mean?'}</span>${S.reveal?`<h2>${esc(x.term)}</h2><div class="answer">${esc(x.definition)}</div><div class="quiet">Marking points: ${esc(x.points.join(' · '))}</div>`:`<h2>${esc(x.term)}</h2><div class="quiet">Think of an exam-ready definition. Tap to reveal.</div>`}</div></div><div class="flash-ctl"><button class="btn" data-action="previous">← Previous</button><button class="btn soft" data-action="flip">${S.reveal?'Hide answer':'Reveal answer'}</button><button class="btn" data-action="next">Next →</button></div><div class="flash-ctl"><button class="btn warn" data-action="card-status" data-status="revise">↻ Need review</button><button class="btn primary" data-action="card-status" data-status="know">✓ I knew it</button></div><div class="flip-details"><div class="note"><b>How to avoid losing marks:</b> ${esc(x.tip)}</div><div class="stack" style="justify-content:space-between">${srclink(x.source)}<span class="footnote">${S.status[x.id]==='know'?'✓ Already marked known':S.status[x.id]==='revise'?'↻ Marked for review':'Not reviewed yet'}</span></div></div>`}`}
function renderDrills(){const q=DRILLS[S.drillIndex];const score=Object.values(S.checks).filter(Boolean).length;return `${labelSection('The marking lab','exam-style practice')}<p class="lede">These are <b>original practice prompts</b> built around particular allocations in the official marking keys—not copies of the original examination questions. Answer mentally or type, then award yourself marks point-by-point.</p><div class="examgrid" style="margin-top:23px"><div class="drill-list">${DRILLS.map((d,i)=>`<button data-action="open-drill" data-index="${i}" class="drillitem ${S.drillIndex===i?'selected':''}"><span class="pill">${d.marks}</span><div><b style="font-size:13px">${esc(d.title)}</b><span>${esc(d.topic)} · ${esc(d.difficulty)}</span></div></button>`).join('')}</div><div class="panel drillcontent"><div class="stack" style="justify-content:space-between"><span class="pill key">${esc(q.topic)} · ${q.marks} marks</span>${srclink(q.source)}</div><h2 style="margin-top:17px">${esc(q.title)}</h2><p style="color:var(--ink)">${esc(q.prompt)}</p><textarea id="draftAnswer" placeholder="Optional: type your answer here or rehearse it aloud. Your draft stays on this page and is not submitted."></textarea><div class="stack"><button class="btn primary" data-action="reveal-mark">${S.showMark?'Hide criteria':'Reveal marking criteria'}</button><button class="btn" data-action="next-drill">Next question →</button></div>${S.showMark?`<div class="divider"></div><div class="stack" style="justify-content:space-between"><h3 style="margin:0">Award yourself one mark for each point</h3><b style="font-size:19px;font-variant-numeric:tabular-nums">${score}/${q.marks}</b></div><ul class="criteria">${q.criteria.map((c,i)=>`<li><label><input type="checkbox" data-act="check-mark" data-mark-index="${i}" ${S.checks[i]?'checked':''}><span><b>${i+1}.</b> ${esc(c)}</span></label></li>`).join('')}</ul><button class="btn sm" data-action="exemplar">${S.showExemplar?'Hide sample answer':'Show full-mark sample answer'}</button>${S.showExemplar?`<div class="sample" style="margin-top:11px"><b>Full-mark model response</b><p style="color:var(--ink);margin:8px 0 0">${esc(q.exemplar)}</p></div>`:''}<p class="hint" style="margin:12px 0 0">Mark against the stated criteria. Accurate scientific alternatives may also earn credit in a real examination.</p>`:''}</div></div>`}
function renderSources(){let aligned=TERMS.filter(x=>x.source!=='SYL').length;const history=[['2025','Memory, operant conditioning, ethics, sleep, wellbeing, SDT and designated studies'],['2024','Sensation and perception, rehearsal, stress, sleep, Pavlov and He et al.'],['2023','Study design, data analysis, validity and memory models'],['2022','Operational hypotheses, research methods and observational learning'],['2021','Sampling, interference, working memory and behaviour modification']];return `${labelSection('Syllabus & marking keys','transparent references')}<div class="panel pad"><h2>Where these definitions came from</h2><p>The term list follows your supplied <b>2026-applicable Year 12 Unit 3 and 4 syllabus</b>. ${aligned} entries connect directly to a relevant criterion or concept in a supplied 2021–2025 SCSA ratified marking key; remaining entries are <b>study-glossary explanations</b> written to teach examinable syllabus points. Wording in the site is generally paraphrased, not represented as verbatim SCSA text.</p><div class="note"><b>Important:</b> Not every term found in an older marking key is examinable in 2026. The glossary filters to your uploaded 2026 syllabus and the older keys are used as wording/examples only. Always read the full question context when checking an official mark.</div></div><div class="sectionheading"><h2>Official marking keys</h2><span class="footnote">Open links from the ZIP package for offline PDFs</span></div><div class="sourcegrid">${history.map(([year,desc])=>`<div class="panel sourcecard"><div class="kicker">RATIFIED MARKING KEY · ${year}</div><h3 style="font-size:20px;margin:8px 0">WACE Psychology ${year}</h3><p>${desc}</p><a class="btn sm soft" href="sources/${esc(PDFS[year])}" target="_blank" rel="noopener">Open ${year} PDF ↗</a></div>`).join('')}<div class="panel sourcecard"><div class="kicker">UNIT 3 + 4 · 2026</div><h3 style="font-size:20px;margin:8px 0">Your uploaded syllabus</h3><p>Officially examinable psychology terminology, designated studies and Science Inquiry dot points used for all topic selection.</p><div class="pill syl">2026-aligned scope</div></div></div><div class="sectionheading"><h2>Term distribution</h2></div><div class="panel pad info-list">${GROUPS.map(g=>`<div class="info-row"><b style="font-size:12px">${esc(g)}</b><div><div class="mini-bar"><span style="width:${Math.round(counts[g]/64*100)}%"></span></div><span class="sourcemini">${counts[g]} definitions</span></div></div>`).join('')}</div><div class="note" style="margin-top:19px"><b>Offline reading:</b> The standalone HTML contains all study content, flashcards and practice questions. For working PDF source links, extract the <b>offline ZIP</b> with its <code>sources</code> folder next to the HTML file. No login, internet connection or downloads inside the site are required.</div>`}
function clock(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function selectBlock(i){i=Math.max(0,Math.min(BLOCKS.length-1,i));S.block=i;S.remaining=BLOCKS[i][1]*60;S.endAt=Date.now()+S.remaining*1000;S.running=true;S.started=true;S.onlyHigh=true;S.onlyKey=false;S.query='';S.topic=i===6?'All':BLOCKS[i][0];newDeck(true);S.view='cards';render();window.scrollTo({top:0,behavior:'instant'});}
function updateTimer(){if(S.running){S.remaining=Math.max(0,Math.round((S.endAt-Date.now())/1000));if(S.remaining<=0){S.running=false;S.endAt=0}}const el=document.getElementById('timerText');if(el){el.textContent=clock(S.remaining);const f=document.getElementById('timerFill');if(f)f.style.width=`${100*(1-S.remaining/(BLOCKS[S.block][1]*60))}%`;}const mini=document.getElementById('miniTimer');if(mini)mini.textContent=(S.running?'❚❚ ':S.remaining===0?'✓ ':'▶ ')+clock(S.remaining);}
document.addEventListener('click',e=>{let x=e.target.closest('[data-action]');if(!x)return;const action=x.dataset.action;
if(action==='navigate'){e.preventDefault();changeView(x.dataset.view)}
else if(action==='theme'){S.dark=!S.dark;save();render()}
else if(action==='status'){let id=Number(x.dataset.id),st=x.dataset.status;S.status[id]=S.status[id]===st?'':st;save();render()}
else if(action==='start-block'){selectBlock(Number(x.dataset.index))}
else if(action==='timer'){if(S.running){updateTimer();S.running=false}else{if(S.remaining===0)S.remaining=BLOCKS[S.block][1]*60;S.running=true;S.endAt=Date.now()+S.remaining*1000}render()}
else if(action==='timer-reset'){S.running=false;S.endAt=0;S.remaining=BLOCKS[S.block][1]*60;render()}
else if(action==='flip'){S.reveal=!S.reveal;render()}
else if(action==='previous'){S.index=(S.index-1+S.deck.length)%S.deck.length;S.reveal=false;render()}
else if(action==='next'){S.index=(S.index+1)%S.deck.length;S.reveal=false;render()}
else if(action==='fresh-deck'){newDeck();render()}
else if(action==='shuffle'){newDeck(true);render()}
else if(action==='card-status'){if(!S.deck.length)return;let id=S.deck[S.index];S.status[id]=x.dataset.status;save();S.index=(S.index+1)%S.deck.length;S.reveal=false;render()}
else if(action==='open-drill'){S.drillIndex=Number(x.dataset.index);S.checks={};S.showMark=false;S.showExemplar=false;render()}
else if(action==='next-drill'){S.drillIndex=(S.drillIndex+1)%DRILLS.length;S.checks={};S.showMark=false;S.showExemplar=false;render()}
else if(action==='reveal-mark'){S.showMark=!S.showMark;render()}
else if(action==='exemplar'){S.showExemplar=!S.showExemplar;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='topicSelect'){S.topic=e.target.value;newDeck();render()}else if(e.target.id==='highOnly'){S.onlyHigh=e.target.checked;newDeck();render()}else if(e.target.id==='keyOnly'){S.onlyKey=e.target.checked;newDeck();render()}else if(e.target.dataset.act==='check-mark'){S.checks[Number(e.target.dataset.markIndex)]=e.target.checked;let total=Object.values(S.checks).filter(Boolean).length;const b=e.target.closest('.drillcontent')?.querySelector('.stack b[style]');if(b)b.textContent=total+'/'+DRILLS[S.drillIndex].marks}});
document.addEventListener('input',e=>{if(e.target.id==='termSearch'){let pos=e.target.selectionStart;S.query=e.target.value;render();let inp=document.getElementById('termSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{let t=e.target;if(t.matches('input,textarea,select'))return;if(S.view==='cards'&&S.deck.length){if(e.key==='ArrowRight'){e.preventDefault();S.index=(S.index+1)%S.deck.length;S.reveal=false;render()}else if(e.key==='ArrowLeft'){e.preventDefault();S.index=(S.index-1+S.deck.length)%S.deck.length;S.reveal=false;render()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();S.reveal=!S.reveal;render()}}});
setInterval(updateTimer,1000);
render();
</script>
</body></html>
